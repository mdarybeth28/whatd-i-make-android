# What'd I Make? Android — Phase 1 compile proof.
#
# What this does TODAY (Phase 1, $0): builds the app on an
# Ubuntu runner WITHOUT any release signing and uploads the
# debug APK as a build artifact. That proves the code compiles
# and the project assembles — everything that can be proven
# before the app's Play Console record exists.
#
# Where this file lives: in the repo it must sit at
#   .github/workflows/android-build.yml
# with the Capacitor project at the repo root (this folder's
# contents become the repo root).
#
# This app is a Capacitor WEB SHELL: capacitor.config.json
# deliberately contains a server.url pointing at the live
# https://whatdimake.com web app. That key IS the app —
# do not remove it. See TRACKER-ANDROID-STATUS.md.
#
# ------------------------------------------------------------------
# LATER — Play closed test / release (do NOT enable yet):
#   Mary's Google Play account exists (created Wed Nov 11, 2026).
#   After that:
#   1. Release signing via GitHub Secrets ONLY — a keystore
#      created by Mary, stored as secrets (for example
#      ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
#      ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD). NEVER commit
#      a keystore, password, or signing file to this repo.
#   2. Switch this workflow from assembleDebug to
#      bundleRelease to produce an .aab (Android App Bundle),
#      which is the format Google Play requires for upload.
#   3. Upload the signed .aab to the Play Console closed-test
#      track for the pilot testers (12 testers / 14 days rule
#      applies only to a later public listing).
# Nothing below the "assemble" step is release work — the
# artifact upload stays either way.
# ------------------------------------------------------------------

name: Android build (unsigned debug proof)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'www/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - '.github/workflows/android-build.yml'

jobs:
  build:
    name: Assemble debug APK (unsigned proof)
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install JS dependencies
        run: npm ci

      - name: Sync web assets + Android project (Capacitor)
        run: npx cap sync android

      - name: Make gradle wrapper executable
        working-directory: android
        run: chmod +x gradlew

      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload the debug APK as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: WhatdIMake-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
